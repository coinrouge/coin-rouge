name: Exploration Wikipédia
on:
  workflow_dispatch:
  push:
    paths: ["scripts/explore.mjs", ".github/workflows/explore.yml"]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save cheerio@1.0.0
      - run: node scripts/explore.mjs
